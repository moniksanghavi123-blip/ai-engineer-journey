[project]
name = "week-01-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "moniksanghavi123-blip", email = "moniksanghavi123@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ollama>=0.6.3",
    "pydantic>=2.14.1",
]

[project.scripts]
week-01-python = "week_01_python:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
